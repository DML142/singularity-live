[package]
name = "singularity-live"
version = "0.1.0"
description = "Desktop context copilot"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "singularity_live"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
async-trait = "0.1.92"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = "0.3.32"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tauri = { version = "2.11.6", features = [] }
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tauri-plugin-global-shortcut = "2.3.2"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
xcap = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["global_shortcuts", "screencast"] }
pipewire = "0.10.1"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
